{% extends 'social/base.html' %}

{% block content %}
<div class="card">
    <h2>Login</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn" type="submit">Login</button>
    </form>

    <p>Don't have an account?</p>
    <a href="{% url 'register' %}">Register</a>
</div>
{% endblock %}
